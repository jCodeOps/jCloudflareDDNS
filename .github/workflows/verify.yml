name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Linux / JDK 25
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Maven build
        run: ./mvnw -B clean verify

      - name: Smoke-test distribution
        shell: bash
        run: |
          distribution_directory="$(mktemp -d)"
          trap 'rm -rf "$distribution_directory"' EXIT
          archive="$(find target -maxdepth 1 -type f -name '*-distribution.tar.gz' -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C "$distribution_directory"
          launcher="$(find "$distribution_directory" -type f -path '*/bin/jcloudflareddns' -print -quit)"
          test -n "$launcher"
          "$launcher" --version
          "$launcher" config init --output "$distribution_directory/config.yml"
          "$launcher" validate --config "$distribution_directory/config.yml" --all
